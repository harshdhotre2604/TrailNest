# Laptop version: static targets on the host's published ports.
# Select it with PROM_CONFIG=prometheus.local.yml in monitoring/.env.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: backend
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels: { instance_id: laptop }

  - job_name: blackbox
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - http://host.docker.internal:3000/
          - http://host.docker.internal:4000/api/health
    # Scrape the exporter, not the site: copy the URL into ?target=, keep it as
    # the readable `instance` label, then point the real scrape at blackbox.
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }
