apiVersion: v1alpha1
discovery:
  jobs:
    - type: AWS/RDS
      regions: [ap-south-1]
      period: 300
      length: 300
      metrics:
        - { name: CPUUtilization, statistics: [Average] }
        - { name: FreeStorageSpace, statistics: [Average] }
        - { name: DatabaseConnections, statistics: [Average] }
        - { name: FreeableMemory, statistics: [Average] }
    - type: AWS/ApplicationELB
      regions: [ap-south-1]
      period: 60
      length: 300
      metrics:
        - { name: RequestCount, statistics: [Sum] }
        - { name: HTTPCode_ELB_5XX_Count, statistics: [Sum] }
        - { name: TargetResponseTime, statistics: [Average] }
