# ── Phase 1: HTTP only ──────────────────────────────────────────────────────────
# This is what ships in the repo. It serves the app over plain HTTP behind nginx
# AND exposes the ACME challenge path so certbot can issue a certificate.
#
# Once you have a cert (see docker-compose.prod.yml header), replace this whole
# file with the "Phase 2" block at the bottom (commented out) — substitute your
# real  YOUR_HOST.nip.io  in every place — then:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml exec nginx nginx -t
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml exec nginx nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # certbot writes its HTTP-01 challenge files here (mounted from ./nginx/certbot-www)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # property media uploads allow images up to 5 MB and videos up to 200 MB;
    # nginx's default cap is 1 MB, which would 413 every real upload.
    client_max_body_size 210m;

    # API + uploaded files -> backend container
    location ~ ^/(api|uploads)/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # everything else (pages, _next assets) -> frontend container
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

