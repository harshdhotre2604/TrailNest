name: Build, Push, and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Swap in real tests once TrailNest has any (npm test --if-present is
      # a no-op today, but keeps the job from silently skipping this step
      # once tests exist).
      - name: Install and test backend
        run: |
          cd backend
          npm ci
          npm test --if-present

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trailnest-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/trailnest-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trailnest-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/trailnest-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # No SSH, no fixed IP — the Auto Scaling Group has neither. Every
      # instance already knows how to become a working TrailNest node from a
      # cold boot (terraform/templates/user_data.sh.tftpl), so a deploy is
      # just asking the ASG to replace its instances with fresh ones that
      # pull these new :latest images on the way up.
      - name: Roll out new instances
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ vars.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}'

      - name: Wait for the refresh to finish
        run: |
          REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${{ vars.ASG_NAME }} \
            --max-records 1 --query "InstanceRefreshes[0].InstanceRefreshId" --output text)
          echo "Watching refresh $REFRESH_ID"
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ vars.ASG_NAME }} \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful) exit 1 ;;
            esac
            sleep 20
          done
