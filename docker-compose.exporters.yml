# Used on the Terraform-provisioned ASG instances, alongside docker-compose.rds.yml
# and docker-compose.images.yml (see terraform/templates/user_data.sh.tftpl).
#
# The Compose equivalent of a Kubernetes node-exporter DaemonSet: every instance
# the ASG ever launches starts these. Only the monitoring box can reach their
# ports (terraform/security_groups.tf). Needs a real Linux host — on Docker
# Desktop the rslave mount fails / reports the hidden VM, so not used locally.

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host # report the VM's real interfaces, listen on :9100
    pid: host
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    ports: ["8080:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
